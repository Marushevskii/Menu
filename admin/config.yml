# Админка меню AIR LOUNGE & BAR (Sveltia CMS).
# Правится только то, что видит гость. Технические настройки — в data/site.json, здесь их нет.
# При переезде на другой аккаунт GitHub поменять строку repo.

backend:
  name: github
  repo: Marushevskii/Menu
  branch: main
  # ТЕСТОВЫЙ стенд: вход по токену («Sign In Using Access Token»). Посредник Cloudflare настроен только на рабочий airlounge.github.io
  commit_messages:
    update: "Админка: изменено «{{slug}}»"
    uploadMedia: "Админка: загружено фото {{path}}"
    deleteMedia: "Админка: удалено фото {{path}}"

site_url: https://marushevskii.github.io/Menu/
display_url: https://marushevskii.github.io/Menu/

# фото позиций: папка photos/, при загрузке сжимаются в WebP
media_folder: photos
public_folder: photos
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1400
          height: 1400

editor:
  preview: false

# ---------- общие куски полей ----------
# Текст на 4 языках. Вводить по-русски; остальные языки — перевод (позже будет заполняться сам).
_langs: &langs
  - { name: ru, label: "Русский", widget: string, required: false }
  - { name: en, label: "English", widget: string, required: false }
  - { name: ka, label: "ქართული (грузинский)", widget: string, required: false }
  - { name: tr, label: "Türkçe (турецкий)", widget: string, required: false }
  - { name: auto, label: "Метка автоперевода", hint: "Сотрите, когда проверите перевод", widget: string, required: false }

_langs_text: &langs_text
  - { name: ru, label: "Русский", widget: text, required: false }
  - { name: en, label: "English", widget: text, required: false }
  - { name: ka, label: "ქართული (грузинский)", widget: text, required: false }
  - { name: tr, label: "Türkçe (турецкий)", widget: text, required: false }
  - { name: auto, label: "Метка автоперевода", hint: "Сотрите, когда проверите перевод", widget: string, required: false }

_unit: &unit
  name: unit
  label: "Единица"
  widget: select
  required: false
  options:
    - { label: "мл", value: ml }
    - { label: "л", value: l }
    - { label: "г", value: g }

_icon: &icon
  name: icon
  label: "Иконка"
  hint: "Показывается, пока нет фото"
  widget: select
  default: cocktail
  options:
    - { label: "Кальян", value: hookah }
    - { label: "Коктейль", value: cocktail }
    - { label: "Шот", value: shot }
    - { label: "Пиво", value: beer }
    - { label: "Бутылка (крепкое)", value: spirits }
    - { label: "Вино", value: wine }
    - { label: "Лимонад", value: lemonade }
    - { label: "Банка (газировка)", value: soda }
    - { label: "Чай", value: tea }
    - { label: "Шейк", value: milkshake }
    - { label: "Снэки", value: snack }
    - { label: "Подарок", value: gift }
    - { label: "Торт", value: cake }
    - { label: "Звезда", value: star }
    - { label: "Камера", value: camera }
    - { label: "Зонт", value: umbrella }
    - { label: "Корона", value: crown }

# позиция меню (Кальян, Бар, Снэки)
_item_fields: &item_fields
  - { name: id, widget: hidden, default: "{{uuid_short}}" }
  - { name: name, label: "Название", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
  - { name: desc, label: "Состав / описание", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", required: false, fields: *langs }
  - { name: price, label: "Цена, ₾", widget: number, value_type: float, required: false }
  - { name: priceFrom, label: "Цена «от»", hint: "На сайте будет «от 8 ₾»", widget: boolean, default: false, required: false }
  - { name: amount, label: "Объём / вес (число)", widget: number, value_type: float, required: false }
  - *unit
  - name: variants
    label: "Варианты с разной ценой"
    label_singular: "вариант"
    hint: "Например лимонады 0,5 л / 1 л или орешки: арахис / фисташки"
    widget: list
    allow_duplicate: false
    required: false
    collapsed: true
    summary: "{{fields.label.ru}} {{fields.amount}} {{fields.unit}} — {{fields.price}} ₾"
    fields:
      - { name: label, label: "Подпись варианта", hint: "Например «Арахис». Можно не заполнять", widget: object, collapsed: true, summary: "{{fields.ru}}", required: false, fields: *langs }
      - { name: amount, label: "Объём / вес", widget: number, value_type: float, required: false }
      - *unit
      - { name: price, label: "Цена, ₾", widget: number, value_type: float }
  - { name: photo, label: "Фото", widget: image, required: false }
  - { name: thumb, widget: hidden }
  - { name: hidden, label: "Скрыть с сайта", hint: "Например, если закончилось", widget: boolean, default: false, required: false }

# раздел вкладки (Классические коктейли, Пиво…)
_section_fields: &section_fields
  - { name: id, widget: hidden, default: "{{uuid_short}}" }
  - { name: layout, widget: hidden, default: list }
  - { name: title, label: "Название раздела", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
  - { name: note, label: "Примечание под названием", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", required: false, fields: *langs_text }
  - *icon
  - name: items
    label: "Позиции"
    label_singular: "позицию"
    widget: list
    allow_duplicate: false
    collapsed: true
    summary: "{{fields.name.ru}}   {{fields.price}} ₾   {{fields.name.auto}}{{fields.desc.auto}}"
    fields: *item_fields

collections:
  - name: menu
    label: "Меню"
    icon: restaurant_menu
    format: json
    files:
      - name: about
        label: "О нас"
        file: data/about.json
        fields:
          - { name: id, widget: hidden }
          - { name: icon, widget: hidden }
          - { name: layout, widget: hidden }
          - { name: menuLabel, widget: hidden }
          - { name: sections, widget: hidden }
          - { name: hideTitle, widget: hidden }
          - { name: title, label: "Название вкладки", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: tabLabel, label: "Подпись на нижней кнопке", hint: "Короткая, чтобы помещалась", widget: object, collapsed: true, summary: "{{fields.ru}}", fields: *langs }
          - name: welcome
            label: "Приветствие"
            widget: object
            collapsed: true
            summary: "{{fields.title.ru}}"
            fields:
              - { name: title, label: "Заголовок", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
              - { name: text, label: "Текст", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs_text }
          - name: features
            label: "Что у нас есть"
            label_singular: "пункт"
            widget: list
            allow_duplicate: false
            collapsed: true
            summary: "{{fields.title.ru}}"
            fields:
              - name: icon
                label: "Значок"
                widget: select
                default: gamepad
                options:
                  - { label: "Геймпад", value: gamepad }
                  - { label: "Кубик", value: dice }
                  - { label: "Кальян", value: hookah }
                  - { label: "Коктейль", value: cocktail }
                  - { label: "Звезда", value: star }
                  - { label: "Подарок", value: gift }
                  - { label: "Корона", value: crown }
              - { name: title, label: "Заголовок", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
              - { name: text, label: "Текст", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs_text }
              - { name: listLabel, label: "Подпись «Список…» на карточке", hint: "Нужна, только если ниже есть список", widget: object, collapsed: true, required: false, summary: "{{fields.ru}}", fields: *langs }
              - name: list
                label: "Список (открывается по нажатию)"
                label_singular: "игру"
                hint: "Например, настольные игры. Пусто — карточка не нажимается"
                widget: list
                required: false
                allow_duplicate: false
                collapsed: true
                summary: "{{fields.name.ru}}  {{fields.players}}"
                fields:
                  - { name: name, label: "Название", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
                  - { name: players, label: "Игроков", hint: "Например: 2–6 или 2+. Можно оставить пустым", widget: string, required: false }
          - { name: playersLabel, label: "Подпись «игроков» над списком", widget: object, collapsed: true, summary: "{{fields.ru}}", fields: *langs }
          - name: hours
            label: "Время работы"
            hint: "Если пусто — строка на сайте не показывается"
            widget: object
            collapsed: true
            summary: "{{fields.value.ru}}"
            fields:
              - { name: label, label: "Подпись", widget: object, collapsed: true, summary: "{{fields.ru}}", fields: *langs }
              - { name: value, label: "Часы", hint: "Каждая строка — с новой строки", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs_text }
          - name: address
            label: "Адрес"
            hint: "Нажатие открывает Google Maps (ссылка — в «Wi-Fi и соцсети»)"
            widget: object
            collapsed: true
            summary: "{{fields.value.ru}}"
            fields:
              - { name: label, label: "Подпись", widget: object, collapsed: true, summary: "{{fields.ru}}", fields: *langs }
              - { name: value, label: "Адрес", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: wifiHint, label: "Подсказка под паролем Wi-Fi", hint: "Сам Wi-Fi — в «Настройки сайта → Wi-Fi и соцсети»", widget: object, collapsed: true, summary: "{{fields.ru}}", fields: *langs }
          - { name: copied, label: "Сообщение «Пароль скопирован»", widget: object, collapsed: true, summary: "{{fields.ru}}", fields: *langs }
          - name: booking
            label: "Кнопка «Забронировать»"
            hint: "Если ссылка пустая — кнопки нет"
            widget: object
            collapsed: true
            summary: "{{fields.label.ru}}"
            fields:
              - { name: label, label: "Надпись на кнопке", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
              - { name: url, label: "Ссылка на бронирование", widget: string, required: false }
          - name: age
            label: "Ограничение 18+"
            widget: object
            collapsed: true
            summary: "{{fields.title.ru}}"
            fields:
              - { name: icon, widget: hidden, default: idcard }
              - { name: title, label: "Заголовок", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
              - { name: text, label: "Текст", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs_text }

      - name: hookah
        label: "Кальян"
        file: data/hookah.json
        fields:
          - { name: id, widget: hidden }
          - { name: icon, widget: hidden }
          - { name: title, label: "Название вкладки", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: menuLabel, label: "Подпись «Меню» под заголовком", widget: boolean, default: true, required: false }
          - { name: sections, label: "Разделы", label_singular: "раздел", widget: list, allow_duplicate: false, collapsed: true, summary: "{{fields.title.ru}}   {{fields.title.auto}}", fields: *section_fields }

      - name: bar
        label: "Бар"
        file: data/bar.json
        fields:
          - { name: id, widget: hidden }
          - { name: icon, widget: hidden }
          - { name: title, label: "Название вкладки", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: menuLabel, label: "Подпись «Меню» под заголовком", widget: boolean, default: true, required: false }
          - { name: sections, label: "Разделы", label_singular: "раздел", widget: list, allow_duplicate: false, collapsed: true, summary: "{{fields.title.ru}}   {{fields.title.auto}}", fields: *section_fields }
          # «Коктейль вне меню» — отдельный блок: только здесь есть шаги конструктора
          - name: offMenu
            label: "Коктейль вне меню"
            hint: "На сайте стоит после «Авторских коктейлей»"
            widget: object
            collapsed: true
            summary: "{{fields.title.ru}}   {{fields.title.auto}}"
            fields:
              - { name: id, widget: hidden, default: off-menu }
              - { name: icon, widget: hidden, default: cocktail }
              - { name: after, widget: hidden, default: signature-cocktails }
              - { name: title, label: "Название раздела", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
              - { name: note, label: "Примечание под названием", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", required: false, fields: *langs_text }
              - name: items
                label: "Позиции"
                label_singular: "позицию"
                widget: list
                allow_duplicate: false
                collapsed: true
                summary: "{{fields.name.ru}}   {{fields.price}} ₾   {{fields.name.auto}}{{fields.desc.auto}}"
                fields:
                  - { name: id, widget: hidden, default: "{{uuid_short}}" }
                  - { name: name, label: "Название", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
                  - { name: desc, label: "Описание", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", required: false, fields: *langs }
                  - { name: price, label: "Цена, ₾", widget: number, value_type: float, required: false }
                  - name: steps
                    label: "Шаги конструктора"
                    hint: "Если шагов нет — обычная карточка"
                    label_singular: "шаг"
                    widget: list
                    allow_duplicate: false
                    required: false
                    collapsed: true
                    summary: "{{fields.title.ru}}   {{fields.title.auto}}"
                    fields:
                      - { name: title, label: "Шаг", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
                      - { name: options, label: "Варианты", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
                  - { name: photo, label: "Фото", widget: image, required: false }
                  - { name: thumb, widget: hidden }
                  - { name: hidden, label: "Скрыть с сайта", hint: "Например, если закончилось", widget: boolean, default: false, required: false }

      - name: snacks
        label: "Снэки"
        file: data/snacks.json
        fields:
          - { name: id, widget: hidden }
          - { name: icon, widget: hidden }
          - { name: title, label: "Название вкладки", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: menuLabel, label: "Подпись «Меню» под заголовком", widget: boolean, default: true, required: false }
          - { name: tabLabel, label: "Подпись на нижней кнопке", hint: "Короткая, чтобы помещалась", widget: object, collapsed: true, summary: "{{fields.ru}}", fields: *langs }
          - { name: sections, label: "Разделы", label_singular: "раздел", widget: list, allow_duplicate: false, collapsed: true, summary: "{{fields.title.ru}}   {{fields.title.auto}}", fields: *section_fields }

      - name: promo
        label: "Акции"
        file: data/promo.json
        fields:
          - { name: id, widget: hidden }
          - { name: icon, widget: hidden }
          - { name: title, label: "Название вкладки", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: menuLabel, label: "Подпись «Меню» под заголовком", widget: boolean, default: true, required: false }
          - { name: tabLabel, label: "Подпись на нижней кнопке", hint: "Короткая, чтобы помещалась", widget: object, collapsed: true, summary: "{{fields.ru}}", fields: *langs }
          - name: sections
            label: "Разделы"
            label_singular: "раздел"
            widget: list
            allow_duplicate: false
            collapsed: true
            summary: "{{fields.title.ru}}   {{fields.title.auto}}"
            fields:
              - { name: id, widget: hidden, default: "{{uuid_short}}" }
              - { name: layout, widget: hidden, default: promo }
              - { name: icon, widget: hidden, default: gift }
              - { name: title, label: "Название раздела", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
              - name: items
                label: "Акции"
                label_singular: "акцию"
                widget: list
                allow_duplicate: false
                collapsed: true
                summary: "{{fields.name.ru}}   {{fields.name.auto}}{{fields.desc.auto}}"
                fields:
                  - { name: id, widget: hidden, default: "{{uuid_short}}" }
                  - *icon
                  - { name: name, label: "Заголовок", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
                  - { name: desc, label: "Текст", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs_text }
                  - { name: hidden, label: "Скрыть с сайта", widget: boolean, default: false, required: false }

  # Мероприятия (Хеллоуин, Новый год…): у каждого своя страница, цвет, значок и обложка.
  # Каждое — отдельный файл data/events/<имя>.json. Хранятся годами: в нужное время просто включить.
  # Сайт показывает включённое мероприятие, если сегодня попадает в его даты
  # (если таких несколько — то, что началось позже). Список для сайта собирает tools/build_events.py при публикации.
  - name: events
    label: "Мероприятия"
    label_singular: "мероприятие"
    icon: celebration
    folder: data/events
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{code}}"
    identifier_field: code
    summary: "{{title.ru}}   ·   {{dateFrom}} – {{dateTo}}"
    sortable_fields: [dateFrom, code]
    fields:
      - { name: code, label: "Короткое имя латиницей", hint: "Только для файла, гости его не видят. Например: halloween, new-year, valentine. Потом не менять", widget: string, pattern: ["^[a-z0-9-]+$", "Только маленькие латинские буквы, цифры и дефис"] }
      - { name: enabled, label: "Включено", hint: "Включённый ивент показывается на сайте в свои даты. Выключенный хранится здесь до следующего раза", widget: boolean, default: false }
      - { name: dateFrom, label: "Показывать с", hint: "Можно оставить пустым — тогда сразу", widget: datetime, date_format: "DD.MM.YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
      - { name: dateTo, label: "Показывать по (включительно)", hint: "Можно оставить пустым — тогда пока не выключите", widget: datetime, date_format: "DD.MM.YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
      - { name: emoji, label: "Значок на кнопке", hint: "Один эмодзи: 🎃 🎄 🎆 ❤️ 🥂", widget: string, default: "🎃" }
      - { name: color, label: "Цвет ивента", hint: "Кнопка, цены и выделения на странице ивента", widget: color, default: "#E8742A" }
      - { name: cover, label: "Обложка страницы (необязательно)", hint: "Картинка вверху страницы ивента, горизонтальная. Если нет — крупный значок", widget: image, required: false }
      - { name: themeSite, label: "Оформлять всё меню на время мероприятия", hint: "Включено — пока мероприятие идёт, всё меню в его оформлении (фон, цвета, рамки). Сцена и крупные украшения — только на странице мероприятия", widget: boolean, default: true, required: false }
      - name: theme
        label: "Оформление страницы"
        hint: "Украшения на странице ивента. Новые темы добавляются в assets/event-themes.js"
        widget: select
        default: ""
        required: false
        options:
          - { label: "Без украшений", value: "" }
          - { label: "Хеллоуин — кровь, привидения, летучие мыши, паутина", value: halloween }
      - { name: title, label: "Название", hint: "Крупно вверху страницы", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
      - { name: subtitle, label: "Подпись под названием", hint: "Например «31 октября · спецменю»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", required: false, fields: *langs }
      - { name: text, label: "Вступительный текст", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", required: false, fields: *langs_text }
      - name: sections
        label: "Разделы"
        label_singular: "раздел"
        widget: list
        allow_duplicate: false
        collapsed: true
        summary: "{{fields.title.ru}}   {{fields.title.auto}}"
        fields:
          - { name: id, widget: hidden, default: "{{uuid_short}}" }
          - name: layout
            label: "Вид раздела"
            widget: select
            default: list
            options:
              - { label: "Позиции с ценой", value: list }
              - { label: "Карточки-акции (без цены)", value: promo }
          - { name: title, label: "Название раздела", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: note, label: "Примечание под названием", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", required: false, fields: *langs_text }
          - *icon
          - name: items
            label: "Позиции"
            label_singular: "позицию"
            widget: list
            allow_duplicate: false
            collapsed: true
            summary: "{{fields.name.ru}}   {{fields.price}} ₾   {{fields.name.auto}}{{fields.desc.auto}}"
            fields:
              - { name: id, widget: hidden, default: "{{uuid_short}}" }
              - { name: name, label: "Название", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
              - { name: desc, label: "Описание", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", required: false, fields: *langs_text }
              - { name: price, label: "Цена, ₾", hint: "Для карточек-акций не нужна", widget: number, value_type: float, required: false }
              - { name: oldPrice, label: "Старая цена, ₾ (зачёркнутая)", hint: "Можно оставить пустым", widget: number, value_type: float, required: false }
              - { name: amount, label: "Объём / вес (число)", widget: number, value_type: float, required: false }
              - *unit
              - *icon
              - { name: hidden, label: "Скрыть с сайта", hint: "Например, если закончилось", widget: boolean, default: false, required: false }

  - name: site
    label: "Настройки сайта"
    icon: settings
    format: json
    files:
      - name: settings
        label: "Wi-Fi и соцсети"
        file: data/settings.json
        fields:
          - { name: name, label: "Название заведения (в шапке)", widget: string }
          - { name: showPhotos, label: "Показывать фото позиций", hint: "Выключено — классический вид меню без фото", widget: boolean, default: true }
          - name: wifi
            label: "Wi-Fi"
            widget: object
            fields:
              - { name: show, label: "Показывать Wi-Fi на сайте", widget: boolean, default: true }
              - { name: name, label: "Имя сети", widget: string, required: false }
              - { name: password, label: "Пароль", widget: string, required: false }
          - name: socials
            label: "Соцсети и карты (внизу сайта)"
            label_singular: "ссылку"
            widget: list
            allow_duplicate: false
            summary: "{{fields.label}}"
            fields:
              - name: type
                label: "Иконка"
                widget: select
                options:
                  - { label: "Instagram", value: instagram }
                  - { label: "Telegram", value: telegram }
                  - { label: "Google Maps", value: google }
                  - { label: "Яндекс Карты", value: yandex }
              - { name: label, label: "Подпись", widget: string }
              - { name: url, label: "Ссылка", hint: "Если пусто — значок серый и не нажимается", widget: string, required: false }

      - name: ui
        label: "Тексты сайта"
        file: data/ui.json
        fields:
          - { name: pageTitle, label: "Заголовок вкладки браузера", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: menu, label: "Подпись «Меню» под заголовком вкладки", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: language, label: "Слово «Язык»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: priceFrom, label: "Цена «от»", hint: "{price} — место для цены", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: ownDrinks, label: "Правило про свои напитки (внизу)", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: orderHint, label: "Подсказка, как заказать (внизу)", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: wifi, label: "Слово «Wi-Fi»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: password, label: "Слово «Пароль»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: followUs, label: "«Мы в соцсетях»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: close, label: "Кнопка «Закрыть»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: unit_ml, label: "Единица «мл»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: unit_l, label: "Единица «л»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: unit_g, label: "Единица «г»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: eventBack, label: "Ивент: кнопка «Вернуться в меню»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: eventHide, label: "Ивент: «Отпустите, чтобы скрыть»", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
          - { name: eventOpen, label: "Ивент: подсказка для незрячих на кнопке", widget: object, collapsed: true, summary: "{{fields.ru}}   {{fields.auto}}", fields: *langs }
