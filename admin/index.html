<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <style>
    /* Телефон: страница админки не уезжает вбок, длинные надписи на кнопках переносятся */
    html, body { max-width: 100%; overflow-x: hidden; }
    @media (max-width: 760px) {
      button { max-width: 100%; white-space: normal !important; height: auto !important; min-height: 32px; text-align: left; }
      button span { white-space: normal !important; overflow-wrap: anywhere; }
      [role="group"], fieldset, section { min-width: 0 !important; max-width: 100%; }
      input, textarea, select { max-width: 100%; }
    }
  </style>
  <title>Админка меню — AIR LOUNGE & BAR</title>
</head>
<body>
  <!-- Sveltia CMS, версия закреплена. Настройки — admin/config.yml -->
  <script src="https://unpkg.com/@sveltia/cms@0.227.2/dist/sveltia-cms.js"></script>
</body>
</html>
