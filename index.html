<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#232323">
  <meta name="color-scheme" content="dark">
  <title>AIR LOUNGE & BAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/bg.webp?v=3" as="image">
  <link rel="stylesheet" href="assets/style.css?v=21">
</head>
<body>
  <!-- фон: готовая картинка assets/bg.webp (рисует tools/render_background.py) -->
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand" id="brand">AIR LOUNGE & BAR</div>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </header>

  <div class="hero" id="hero"></div>

  <div class="chips-wrap" id="chipsWrap"><div class="chips-bg" id="chipsBg"></div><nav class="chips" id="chips"></nav></div>

  <main id="content" class="content"></main>

  <footer class="footer" id="footer"></footer>

  <nav class="tabbar" id="tabbar">
    <span class="lens" aria-hidden="true"></span>
    <div class="tabs" id="tabs"></div>
  </nav>

  <!-- преломление для «жидкого стекла» (работает в Chrome/Android, на iPhone — обычное стекло) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="viewer" id="viewer" hidden>
    <button class="viewer-close" id="viewerClose" type="button">×</button>
    <img id="viewerImg" alt="">
    <div class="viewer-caption" id="viewerCaption"></div>
  </div>

  <div class="loading" id="loading"><span>AIR LOUNGE & BAR</span></div>

  <script src="assets/app.js?v=21"></script>
</body>
</html>
