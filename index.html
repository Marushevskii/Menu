<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#232323">
  <meta name="color-scheme" content="dark">
  <title>AIR LOUNGE & BAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/bg.webp?v=6" as="image" media="(max-aspect-ratio: 1/1)">
  <link rel="preload" href="assets/bg-wide.webp?v=6" as="image" media="(min-aspect-ratio: 1/1)">
  <link rel="preload" href="assets/flame-big.png?v=1" as="image">
  <link rel="stylesheet" href="assets/style.css?v=58">
</head>
<body>
  <!-- фон: готовая картинка assets/bg.webp (рисует tools/render_background.py) -->
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name" id="brand">AIR LOUNGE <span class="amp">&amp;</span> BAR</span></div>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </header>

  <div class="hero" id="hero"></div>

  <div class="chips-wrap" id="chipsWrap"><div class="chips-bg" id="chipsBg"></div><nav class="chips" id="chips"></nav></div>

  <main id="content" class="content"></main>

  <footer class="footer" id="footer"></footer>

  <nav class="tabbar" id="tabbar">
    <span class="lens" aria-hidden="true"></span>
    <div class="tabs" id="tabs"></div>
  </nav>

  <!-- страница ивента: вместо нижних вкладок — кнопка «Вернуться в меню» -->
  <a class="ev-back" id="evBack" href="#" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="evBackLabel"></span></a>

  <!-- кнопка ивента (как у Wolt): двигается пальцем, унести вниз в «×» — спрятать до завтра -->
  <div class="ev-trash" id="evTrash" hidden><span class="ev-x" aria-hidden="true">×</span><span id="evTrashLabel"></span></div>
  <button class="ev-bubble" id="evBubble" type="button" hidden><span class="ev-face" id="evFace"></span><span class="ev-dot" aria-hidden="true"></span></button>

  <!-- преломление для «жидкого стекла» (работает в Chrome/Android, на iPhone — обычное стекло) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="viewer" id="viewer" hidden>
    <button class="viewer-close" id="viewerClose" type="button">×</button>
    <img id="viewerImg" alt="">
    <div class="viewer-caption" id="viewerCaption"></div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="sheet-close" type="button" aria-label="×">×</button></div>
      <div class="sheet-cols"><span id="sheetCount"></span></div>
      <div class="sheet-body" id="sheetBody"><ol class="sheet-list" id="sheetList"></ol></div>
    </div>
  </div>

  <div class="loading" id="loading"><div class="loading-box"><i class="loading-mark" aria-hidden="true"></i><span>AIR LOUNGE & BAR</span></div></div>

  <script src="assets/app.js?v=61"></script>
</body>
</html>
