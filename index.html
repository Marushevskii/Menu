<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160a09">
  <meta name="color-scheme" content="dark">
  <title>AIR LOUNGE & BAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
  <!-- живой фон: тёплая «дымка» в цветах интерьера -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
    <!-- шёлковые волны: широкие мягкие «складки» + тонкие светящиеся линии -->
    <svg class="silk" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#b8743f" stop-opacity="0"/>
          <stop offset=".5" stop-color="#c98a4b" stop-opacity=".7"/>
          <stop offset="1" stop-color="#6b3a20" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f6d3a0" stop-opacity="0"/>
          <stop offset=".3" stop-color="#f6d3a0" stop-opacity=".95"/>
          <stop offset=".7" stop-color="#e9a85a" stop-opacity=".6"/>
          <stop offset="1" stop-color="#e9a85a" stop-opacity="0"/>
        </linearGradient>
        <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
        <filter id="fShine" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
        <filter id="fGlow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".5"/></filter>
        <path id="w1" d="M450 70 C 340 150, 320 300, 180 345 S -10 330, -60 460"/>
        <path id="w2" d="M-60 545 C 50 495, 140 630, 245 650 S 385 585, 470 690"/>
        <path id="w3" d="M150 870 C 240 770, 320 715, 470 735"/>
      </defs>
      <!-- мягкие складки ткани -->
      <g filter="url(#fSoft)" fill="none" stroke="url(#gBand)">
        <use href="#w1" stroke-width="80" opacity=".28"/>
        <use href="#w2" stroke-width="100" opacity=".5"/>
        <use href="#w3" stroke-width="70" opacity=".4"/>
      </g>
      <!-- блик вдоль складки -->
      <g filter="url(#fShine)" fill="none" stroke="url(#gLine)">
        <use href="#w1" stroke-width="6" opacity=".12" transform="translate(0 -14)"/>
        <use href="#w2" stroke-width="8" opacity=".4" transform="translate(0 -18)"/>
      </g>
      <!-- тонкие светящиеся линии пучками -->
      <g class="silk-lines" filter="url(#fGlow)" fill="none" stroke="url(#gLine)">
        <use href="#w1" stroke-width="1" opacity=".32"/>
        <use href="#w1" stroke-width=".6" opacity=".22" transform="translate(0 9)"/>
        <use href="#w1" stroke-width=".5" opacity=".15" transform="translate(0 20)"/>
        <use href="#w2" stroke-width="1.3" opacity=".75"/>
        <use href="#w2" stroke-width=".8" opacity=".5" transform="translate(0 8)"/>
        <use href="#w2" stroke-width=".6" opacity=".35" transform="translate(0 18)"/>
        <use href="#w2" stroke-width=".4" opacity=".25" transform="translate(0 31)"/>
        <use href="#w3" stroke-width="1" opacity=".55"/>
        <use href="#w3" stroke-width=".6" opacity=".35" transform="translate(0 10)"/>
      </g>
    </svg>
    <span class="grain"></span>
  </div>

  <header class="topbar">
    <div class="brand" id="brand">AIR LOUNGE & BAR</div>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </header>

  <div class="hero" id="hero"></div>

  <nav class="chips" id="chips"></nav>

  <main id="content" class="content"></main>

  <footer class="footer" id="footer"></footer>

  <nav class="tabbar" id="tabbar">
    <span class="lens" aria-hidden="true"></span>
    <div class="tabs" id="tabs"></div>
  </nav>

  <!-- преломление для «жидкого стекла» (работает в Chrome/Android, на iPhone — обычное стекло) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="viewer" id="viewer" hidden>
    <button class="viewer-close" id="viewerClose" type="button">×</button>
    <img id="viewerImg" alt="">
    <div class="viewer-caption" id="viewerCaption"></div>
  </div>

  <div class="loading" id="loading"><span>AIR LOUNGE & BAR</span></div>

  <script src="assets/app.js?v=6"></script>
</body>
</html>
